<!-- 主题预挂载: 回放用户在本站/报告页的显式选择 (localStorage 'ca-theme'), 防切页闪白; 同步 theme-color -->

  var c=t==='dark'?'#131118':'#fbfafc';
  document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',c);});
  });
}}catch(e){}})();</script>

<script defer src="app.js?v=3"></script>

<style>
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--text);line-height:var(--lh-body);overflow-x:hidden;
    background-image:radial-gradient(1100px 420px at 50% -8%,var(--purple-bg),transparent 70%);background-repeat:no-repeat;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  :focus-visible{outline:none;box-shadow:var(--ring);}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

  /* ---- 导航 ---- */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);background:var(--glass-bg);}
  .nav-logo{font-weight:700;font-size:14px;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;
    background:none;border:none;cursor:pointer;font-family:var(--font-display);padding:6px 8px;border-radius:8px;transition:color var(--t-fast);}
  .nav-logo:hover{color:var(--pink-600);}
  .nav-logo .turtle{font-size:19px;}
  .nav-links{display:flex;gap:2px;align-items:center;}
  .nav-links .nl{font-size:13px;color:var(--text-2);background:none;border:none;font-family:var(--font-body);font-weight:500;
    padding:6px 10px;border-radius:8px;transition:color var(--t-fast),background var(--t-fast);cursor:pointer;text-decoration:none;}
  .nav-links .nl:hover{color:var(--text);background:var(--bg-3);}
  .theme-btn{width:32px;height:32px;margin-left:6px;border:1px solid var(--border-2);border-radius:8px;background:transparent;
    color:var(--text-2);font-size:14px;line-height:1;cursor:pointer;transition:color var(--t-fast),border-color var(--t-fast);}
  .theme-btn:hover{color:var(--pink);border-color:var(--border-pink);}

  .wrap{max-width:var(--content-max);margin:0 auto;padding:0 24px;}

  /* ---- Hero ---- */
  .hero{display:flex;align-items:center;gap:40px;padding:40px 0 8px;}
  .hero-text{flex:1;min-width:0;}
  .hero-badge{display:inline-block;font-size:11px;font-weight:600;color:var(--purple);border:1px solid var(--purple-300);
    padding:3px 12px;border-radius:999px;margin-bottom:14px;letter-spacing:.5px;}
  .hero h1{font-family:var(--font-display);font-size:var(--fs-hero);font-weight:700;letter-spacing:-.5px;margin:0 0 12px;color:var(--text);}
  .hero-rule{display:block;width:56px;height:4px;border-radius:2px;background:var(--grad-brand);margin:0 0 14px;}
  .hero p{color:var(--text-2);font-size:14px;max-width:540px;margin:0 0 12px;}
  .hero-dateline{font-size:12px;color:var(--text-3);}
  .hero-mascot{flex:none;}

  /* ---- 状态条 ---- */
  .statebar{display:grid;grid-template-columns:repeat(5,1fr);margin:24px 0;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);overflow:hidden;}
  .st{padding:14px 18px;border-left:1px solid var(--border);}
  .st:first-child{border-left:none;}
  .st-l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:3px;white-space:nowrap;}
  .st-v{font-size:22px;font-weight:700;color:var(--text);line-height:1.2;white-space:nowrap;}
  .bull-t{color:var(--bull-strong);} .bear-t{color:var(--bear-strong);} .neg-t{color:var(--bear-ink);font-weight:700;}
  .warn-t{color:var(--neutral-strong);}

  /* ---- 通用面板 ---- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);
    padding:20px 24px;margin-bottom:24px;}
  .panel-kicker{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;}
  .panel-kicker h2{font:inherit;letter-spacing:inherit;color:inherit;margin:0;}
  .panel-kicker .mono{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;}
  .hold-offline p{margin:4px 0 0;font-size:13px;color:var(--text-2);}

  /* ---- 净值卡 ---- */
  .pnl-main{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .pnl-value{font-size:28px;font-weight:700;color:var(--text);}
  .pnl-delta{font-size:16px;font-weight:700;}
  .pnl-sub{font-size:12px;color:var(--text-3);margin-top:2px;}
  .nav-chart{position:relative;margin-top:10px;}
  .nav-chart svg{display:block;}
  .nav-chart-y{position:absolute;left:2px;top:0;height:160px;display:flex;flex-direction:column;justify-content:space-between;
    font-size:11px;color:var(--text-3);pointer-events:none;z-index:1;}
  .nav-base-tag{position:absolute;right:2px;transform:translateY(-115%);font-size:11px;color:var(--text-3);pointer-events:none;z-index:1;}
  .nav-chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:4px;}
  .pnl-stats{display:flex;gap:6px 20px;flex-wrap:wrap;font-size:12px;margin-top:10px;color:var(--text-2);}
  .pnl-stats .dim{color:var(--text-3);}
  .pnl-open{font-size:12px;color:var(--text-3);margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}

  /* ---- 工具条 ---- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;scroll-margin-top:72px;}
  .toolbar .grow{flex:1;min-width:220px;}
  .sortsel{height:36px;padding:0 12px;font-size:13px;font-weight:500;border:1px solid var(--border-2);border-radius:8px;
    background:var(--surface);color:var(--text);cursor:pointer;font-family:var(--font-body);}
  .sortsel:focus{outline:none;border-color:var(--pink);box-shadow:var(--ring);}
  .results{font-size:12px;color:var(--text-3);margin-bottom:16px;}
  .results .stale{color:var(--neutral-strong);}

  /* ---- 分区标题 ---- */
  .section-head{display:flex;align-items:baseline;gap:10px;margin:32px 0 16px;font-weight:400;}
  .section-head .zh{font-size:15px;font-weight:700;color:var(--text);}
  .section-head .en{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);}
  .section-head .ct{font-size:11px;color:var(--text-3);}
  .section-head .rule{flex:1;height:1px;background:var(--border);align-self:center;}

  /* ---- 报告卡 ---- */
  .cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));margin-bottom:40px;}
  .rcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-xl);box-shadow:var(--shadow-sm);overflow:hidden;
    transition:transform var(--t-base),box-shadow var(--t-base),border-color var(--t-base);}
  .rcard:hover{transform:translateY(-2px);border-color:var(--border-2);box-shadow:var(--shadow-md);}
  .rcard:focus-within{transform:translateY(-2px);border-color:var(--pink);box-shadow:var(--shadow-md);}
  .rcard-link:focus-visible{box-shadow:none;}
  .rcard-body{padding:18px 20px 14px;flex:1;}
  .rcard-head{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--text-3);
    letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;}
  .rcard-head span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rcard-head .rcard-date{flex:none;}
  .rcard-name{font-size:var(--fs-lg);font-weight:700;color:var(--text);margin:0 0 10px;display:flex;align-items:center;gap:8px;line-height:1.35;}
  .rcard-link{color:inherit;text-decoration:none;}
  /* stretched link: 整卡可点, 卡内其他链接 z-index 提升 */
  .rcard-link::after{content:'';position:absolute;inset:0;}
  .rcard-ver{font-size:var(--fs-2xs);font-weight:600;color:var(--text-3);border:1px solid var(--border-2);
    padding:1px 6px;border-radius:6px;letter-spacing:.03em;}
  .rcard-verdict{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .gear-chip{font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;border:1px solid transparent;}
  .gear-chip.bull{background:var(--bull-bg);color:var(--bull-ink);border-color:color-mix(in srgb,var(--bull-strong) 30%,transparent);}
  .gear-chip.bear{background:var(--bear-bg);color:var(--bear-ink);border-color:color-mix(in srgb,var(--bear-strong) 30%,transparent);}
  .gear-chip.neutral{background:var(--neutral-bg);color:var(--neutral-strong);border-color:color-mix(in srgb,var(--neutral-strong) 35%,transparent);}
  .gear-chip.outline{background:transparent;}
  .ghost-chip{font-size:11px;font-weight:500;color:var(--text-2);border:1px solid var(--border-2);
    padding:3px 9px;border-radius:999px;}
  .rcard-one{font-size:13px;color:var(--text-2);line-height:1.6;margin:0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .rcard-metrics{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border);}
  .rm{padding:10px 14px;border-left:1px solid var(--border);}
  .rm:first-child{border-left:none;}
  .rm-l{font-size:var(--fs-2xs);color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rm-v{font-size:13px;font-weight:700;color:var(--text);}
  .rm-v.pos{color:var(--bull-ink);} .rm-v.neg{color:var(--bear-ink);}
  .rcard-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    border-top:1px solid var(--border);padding:10px 20px;}
  .rcard-foot-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .disc{font-size:11px;padding:2px 8px;border-radius:6px;}
  .disc.future{color:var(--text-2);background:var(--bg-3);}
  .disc.soon{color:var(--neutral-strong);background:var(--neutral-bg);font-weight:700;}
  .disc.past{color:var(--text-3);background:var(--bg-2);}
  .old-ver{position:relative;z-index:1;font-size:11px;color:var(--text-3);text-decoration:none;}
  .old-ver:hover{color:var(--pink-600);text-decoration:underline;}
  .rcard-cta{font-size:13px;font-weight:600;color:var(--pink-600);white-space:nowrap;}
  .rcard:hover .rcard-cta{text-decoration:underline;text-underline-offset:3px;}

  .empty{text-align:center;padding:56px 20px;color:var(--text-3);background:var(--surface);border-radius:var(--r-xl);border:1px dashed var(--border-2);margin-bottom:36px;}
  .empty .ic{font-size:40px;opacity:.5;margin-bottom:10px;}

  /* ---- 页脚 ---- */
  .footer{padding:22px 0 44px;border-top:1px solid var(--border);}
  .f-links{display:flex;gap:18px;font-size:13px;margin-bottom:6px;}
  .f-links a{color:var(--text-2);text-decoration:none;font-weight:500;}
  .f-links a:hover{color:var(--pink);text-decoration:underline;text-underline-offset:3px;}
  .f-legal{font-size:11px;color:var(--text-3);}

  /* ---- 暗色微调: 吉祥物白底立绘压暗, 不做整页最亮元素 ---- */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .ds-mascot__char img{filter:brightness(.82) contrast(1.05);}
  }
  :root[data-theme="dark"] .ds-mascot__char img{filter:brightness(.82) contrast(1.05);}

  /* ---- 入场动画 (仅增强, 不做内容门控) ---- */
  @media (prefers-reduced-motion:no-preference){
    .hero-text,.statebar,.panel{animation:ds-rise .4s var(--ease) both;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }

  /* ---- 响应式 ---- */
  @media (max-width:720px){
    .nav{padding:0 12px;}
    .nav-links .nl{display:none;}
    .nav-links .nl-gh{display:inline-block;padding:10px 12px;}
    .theme-btn{width:40px;height:40px;}
    .hero{flex-direction:column-reverse;text-align:left;gap:16px;padding-top:28px;}
    .hero-mascot{align-self:flex-end;margin-right:4px;}  /* 气泡朝左伸, 靠右留足空间 */
    .wrap{padding:0 16px;}
    .cards{grid-template-columns:1fr;}
    .statebar{grid-template-columns:repeat(2,1fr);}
    .st{border-top:1px solid var(--border);}
    .st:nth-child(-n+2){border-top:none;}
    .st:nth-child(odd){border-left:none;}
    .st:nth-child(even){border-left:1px solid var(--border);}
    .st:last-child{grid-column:1 / -1;border-left:none;}
    .ds-tabs{height:auto;min-height:36px;flex-wrap:wrap;}  /* 市场数是数据驱动的, 多了要能换行 */
    .toolbar .ds-search input{font-size:16px;}  /* iOS 聚焦防自动缩放 (特异性需高于组件注入样式) */
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- 配置 -->
<script>
  window.SITE = { github: 'https://github.com/leafpaper/Inves-Report' };
</script>
</body>
</html>
